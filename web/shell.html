<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hades Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #ccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 400; }
    #progress-bar {
      width: 300px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: #5a9;
      transition: width 0.2s;
    }
    #status { margin-top: 0.75rem; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Loading...</h1>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="status">Downloading</div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      setStatus: function(text) {
        var statusEl = document.getElementById('status');
        if (statusEl) statusEl.textContent = text || 'Loading...';
        if (!text || text === '') {
          var loading = document.getElementById('loading');
          if (loading) loading.classList.add('hidden');
        }
        var m = text.match(/(\d+(\.\d+)?)\/(\d+)/);
        if (m) {
          var pct = (parseFloat(m[1]) / parseFloat(m[3])) * 100;
          var fill = document.getElementById('progress-fill');
          if (fill) fill.style.width = pct + '%';
        }
      },
      monitorRunDependencies: function(left) {
        if (left === 0) {
          Module.setStatus('');
        }
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function(e) {
      Module.setStatus('Error: ' + e);
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
