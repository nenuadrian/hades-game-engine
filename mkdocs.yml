site_name: Hades Game Engine
site_description: Architecture and developer documentation for Hades.
repo_url: https://github.com/nenuadrian/hades-game-engine
repo_name: nenuadrian/hades-game-engine
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  logo: logo.jpeg
  favicon: logo.jpeg
  palette:
    scheme: slate
    primary: black
    accent: green
  font:
    text: IBM Plex Mono
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Scripting: scripting.md
  - API: api.md
  - Metrics: metrics.md
  - Architecture:
    - Overview: architecture.md
    - Class Relationships: generated/class-relationships.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false
