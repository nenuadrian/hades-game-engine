name: CMake on multiple platforms with Vulkan support

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibTorch (via pip)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      # Install build dependencies on Ubuntu.
      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libglu1-mesa-dev freeglut3-dev mesa-common-dev \
          xorg-dev libvulkan-dev vulkan-tools \
          libcurl4-openssl-dev

      # Use a minimal Vulkan setup on Windows instead of the full LunarG installer,
      # which is large and can stall on GitHub-hosted runners.
      - name: Setup Vulkan SDK (Windows)
        if: matrix.os == 'windows-latest'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Install Vulkan SDK (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          sdk_tmp_dir="$(mktemp -d)"
          curl --fail --location -o "$sdk_tmp_dir/vulkan-sdk.zip" https://sdk.lunarg.com/sdk/download/latest/mac/vulkan-sdk.zip
          unzip -q "$sdk_tmp_dir/vulkan-sdk.zip" -d "$sdk_tmp_dir"

          sdk_app="$(find "$sdk_tmp_dir" -maxdepth 2 -name 'vulkansdk-macOS-*.app' -print -quit)"
          if [ -z "$sdk_app" ]; then
            echo "Failed to locate the Vulkan SDK installer app."
            exit 1
          fi

          sdk_version="$(basename "$sdk_app" .app | sed 's/^vulkansdk-macOS-//')"
          sdk_root="$HOME/VulkanSDK/$sdk_version"

          "$sdk_app/Contents/MacOS/vulkansdk-macOS-$sdk_version" \
            --root "$sdk_root" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install \
            copy_only=1 \
            com.lunarg.vulkan.core

          echo "VULKAN_SDK=$sdk_root/macOS" >> "$GITHUB_ENV"
          echo "$sdk_root/macOS/bin" >> "$GITHUB_PATH"

      - name: Install CURL (Windows, via vcpkg)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_TARGET_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install CURL (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install curl

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >-
          cmake -S "${{ github.workspace }}"
          -B "${{ steps.strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DHADES_USE_BUNDLED_DEPS=OFF

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Verify runtime export (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BUILD_DIR="${{ steps.strings.outputs.build-output-dir }}"
          RUNTIME="$BUILD_DIR/HadesRuntime"
          if [ ! -f "$RUNTIME" ]; then
            echo "ERROR: HadesRuntime binary not found at $RUNTIME"
            exit 1
          fi

          TEST_PROJECT="${{ github.workspace }}/tests/fixtures/export-test-project"
          EXPORT_DIR="$(mktemp -d)/ExportTest"
          mkdir -p "$EXPORT_DIR"

          # Package: copy binary, project data, and engine assets.
          cp "$RUNTIME" "$EXPORT_DIR/"
          chmod +x "$EXPORT_DIR/HadesRuntime"
          cp -r "$TEST_PROJECT/.hades" "$EXPORT_DIR/.hades"
          cp -r "${{ github.workspace }}/assets" "$EXPORT_DIR/assets"

          # Verify the packaging structure.
          test -f "$EXPORT_DIR/HadesRuntime"
          test -f "$EXPORT_DIR/.hades/worlds/TestWorld.json"
          test -d "$EXPORT_DIR/assets"
          echo "Packaging structure OK"

          # Launch in headless mode with a timeout. The runtime enters an
          # infinite loop, so we kill it after 5 seconds.
          # A clean kill (SIGTERM) is the expected outcome.
          # Any crash before the timeout indicates a real failure.
          set +e
          "$EXPORT_DIR/HadesRuntime" --project "$EXPORT_DIR" --headless &
          PID=$!
          sleep 5
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null
            wait "$PID" 2>/dev/null
            EXIT_CODE=0
          else
            wait "$PID" 2>/dev/null
            EXIT_CODE=$?
          fi
          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "ERROR: Runtime crashed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Runtime export verification passed"

      - name: Verify runtime export (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
          $runtime = Join-Path $buildDir "Release" "HadesRuntime.exe"
          if (-not (Test-Path $runtime)) {
            $runtime = Join-Path $buildDir "HadesRuntime.exe"
          }
          if (-not (Test-Path $runtime)) {
            Write-Error "HadesRuntime.exe not found"
            exit 1
          }

          $testProject = Join-Path "${{ github.workspace }}" "tests" "fixtures" "export-test-project"
          $exportDir = Join-Path $env:RUNNER_TEMP "ExportTest"
          New-Item -ItemType Directory -Path $exportDir -Force | Out-Null

          # Package: copy binary, project data, and engine assets.
          Copy-Item $runtime -Destination $exportDir
          Copy-Item (Join-Path $testProject ".hades") -Destination (Join-Path $exportDir ".hades") -Recurse
          Copy-Item (Join-Path "${{ github.workspace }}" "assets") -Destination (Join-Path $exportDir "assets") -Recurse

          # Copy any DLLs from the build output alongside the binary.
          $dllDir = Join-Path $buildDir "Release"
          if (Test-Path $dllDir) {
            Get-ChildItem -Path $dllDir -Filter "*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $exportDir
            }
          }

          # Copy Vulkan loader DLL from the SDK so the binary can start.
          if ($env:VULKAN_SDK) {
            $vulkanDll = Get-ChildItem -Path $env:VULKAN_SDK -Filter "vulkan-1.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($vulkanDll) {
              Copy-Item $vulkanDll.FullName -Destination $exportDir
              Write-Host "Copied Vulkan loader from $($vulkanDll.FullName)"
            } else {
              Write-Host "Warning: vulkan-1.dll not found in VULKAN_SDK ($env:VULKAN_SDK)"
            }
          }

          # Verify packaging structure.
          if (-not (Test-Path (Join-Path $exportDir "HadesRuntime.exe"))) { exit 1 }
          if (-not (Test-Path (Join-Path $exportDir ".hades" "worlds" "TestWorld.json"))) { exit 1 }
          if (-not (Test-Path (Join-Path $exportDir "assets"))) { exit 1 }
          Write-Host "Packaging structure OK"

          # List exported files for debugging DLL issues.
          Write-Host "Export directory contents:"
          Get-ChildItem -Path $exportDir | ForEach-Object { Write-Host "  $($_.Name)" }

          # Launch headless with a 5-second timeout.
          $proc = Start-Process -FilePath (Join-Path $exportDir "HadesRuntime.exe") `
            -ArgumentList "--project", $exportDir, "--headless" `
            -PassThru -NoNewWindow
          $exited = $proc.WaitForExit(5000)
          if (-not $exited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "Runtime started successfully (stopped after 5s timeout)"
          } elseif ($proc.ExitCode -ne 0) {
            Write-Error "Runtime crashed with exit code $($proc.ExitCode)"
            exit 1
          }
          Write-Host "Runtime export verification passed"
