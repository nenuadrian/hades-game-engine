name: Web build (Emscripten / WebAssembly)

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "cmake/**"
      - "web/**"
      - "scripts/build-web.sh"
      - "CMakeLists.txt"
      - ".github/workflows/web-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "cmake/**"
      - "web/**"
      - "scripts/build-web.sh"
      - "CMakeLists.txt"
      - ".github/workflows/web-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: ./scripts/build-web.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hades-web
          path: |
            build-web/Hades.html
            build-web/Hades.js
            build-web/Hades.wasm
            build-web/Hades.data
            build-web/HadesRuntime.html
            build-web/HadesRuntime.js
            build-web/HadesRuntime.wasm
            build-web/HadesRuntime.data
          if-no-files-found: error
